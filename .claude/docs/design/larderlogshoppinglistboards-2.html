<footer>
  Boards scale to the window; each is drawn at the pixel size shown beside its name. Type is Playfair&nbsp;Display and Karla, loaded from Google Fonts — offline they fall back to Georgia and the system sans, so the metrics shift slightly.
</footer>
<script>
  const L = document.getElementById('light'), D = document.getElementById('dark');
  const btns = { bL:['1','0'], bD:['0','1'], bB:['1','1'] };
  function show(id) {
    const [l, d] = btns[id];
    L.hidden = l === '0'; D.hidden = d === '0';
    for (const k in btns) document.getElementById(k).setAttribute('aria-pressed', String(k === id));
    fit();
  }
  for (const k in btns) document.getElementById(k).onclick = () => show(k);
  function fit() {
    document.querySelectorAll('.scaler').forEach((s) => {
      const f = s.firstElementChild;
      const w = +f.dataset.w, h = +f.dataset.h;
      const k = Math.min(1, s.clientWidth / w);
      f.style.transform = 'scale(' + k + ')';
      s.style.height = (h * k) + 'px';
    });
  }
  addEventListener('resize', fit); addEventListener('load', fit); fit();
</script>
